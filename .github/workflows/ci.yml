name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04, windows-2025, macos-26 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore FlexibleArray.slnx

      - name: Build
        run: dotnet build FlexibleArray.slnx --no-restore --configuration Release

      - name: Format
        run: dotnet format FlexibleArray.slnx --verify-no-changes --no-restore

      - name: Test
        # MTP mode: the xunit v3 test assemblies are self-executing
        # Microsoft.Testing.Platform apps, so the VSTest-era --logger option no
        # longer exists. --report-trx (provided by
        # Microsoft.Testing.Extensions.TrxReport, referenced by each test
        # project) writes one .trx per project into TestResults.
        run: dotnet test --solution FlexibleArray.slnx --no-build --configuration Release --report-trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  # libc diversity: the same source-generated interop against musl instead of glibc.
  build-test-musl:
    name: Build & Test (alpine musl)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        # Same TRX reporting as the matrix job; the artifact name has no
        # matrix.os to interpolate, so it is fixed to the libc under test.
        run: |
          ICU_DIR=/usr/lib dotnet test --solution FlexibleArray.slnx --configuration Release --report-trx --results-directory TestResults
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'true'

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-musl
          path: TestResults
          if-no-files-found: ignore
